name: Validate tournament history
on:
  pull_request:
  push:
    branches: [main]
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node history-checks.cjs
      - run: node history-ui-checks.cjs
      - run: node checks.cjs
